      description: from/to는 함께 지정 또는 함께 생략. 생략은 한국 오늘 포함7일. 시작≤종료. 종료시각이 [from00:00,to다음날00:00)인 완료/취소/실패 실행만. 종료불명
        제외. 완료합계/정렬/점수/평균은 usage-analysis 명세 기준. 동의 없으면 기록을 반환하지 않습니다.
      x-requirements:
