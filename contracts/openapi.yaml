openapi: 3.0.3
info:
  title: 단짝 공동 HTTP 계약
  version: 1.0.0
  description: '#11에서 확정한 구현 기준입니다. API 실행 완료를 뜻하지 않습니다. 업무 규칙은 docs/specs/requirements, 저장·종료 책임은 contracts/decisions.md를
    따릅니다. 모든 식별자는 십진 문자열 또는 명시된 UUID, 금액은 정수 원입니다. 오류는 ApiError를 사용합니다. 개인정보 응답은 Cache-Control: no-store. 인증 쿠키는
    HttpOnly이며 운영 HTTPS에서는 Secure, SameSite=Lax. 상태 변경 요청은 세션의 X-CSRF-Token을 검증합니다.'
  contact:
    name: 단짝 개발팀
    url: https://github.com/team-bestfriend/danjjak-app/issues/11
servers:
- url: /
  description: 같은 origin 또는 FE 개발 프록시. Tomcat context가 /danjjak이면 FE base URL에 /danjjak을 지정.
security:
- SessionCookie: []
tags:
- name: health
  description: 실행 환경 상태
- name: auth
  description: 카카오 인증·세션
- name: user
  description: 내 정보·설정·독립 동의
- name: account
  description: 내 계좌·사람·복수 받는 계좌·금융 조회
- name: pattern
  description: 7종 템플릿·단축번호
- name: guidance
  description: 시작/단계 문구·가족 파일
- name: execution
  description: 동의 기반 실행·방문
- name: transfer
  description: 모의 송금·FDS·결과 확인
- name: support
  description: 보호자·고객센터·카톡 본인 시연
- name: tts
  description: 현재 안내의 AI 합성
- name: analysis
  description: 기간 집계·안내 비교·적용
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
      - health
      summary: 서버·DB 상태 확인
      description: 인증 불필요. API 서버·DB가 모두 준비되어야 200 UP. DB 실패/설정 누락은 503 ApiError이며 내부 연결 문자열은 숨깁니다.
      x-requirements:
      - NFR-003
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/auth/kakao/start:
    get:
      operationId: startKakaoLogin
      tags:
      - auth
      summary: 카카오 로그인 시작
      description: fetch 대신 브라우저 이동. 서버가 일회 state를 세션에 저장하고 카카오 인증 화면으로 이동. 임의 redirect URL을 받지 않습니다.
      x-requirements:
      - FR-001
      responses:
        '302':
          description: 처리 성공.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Location:
              schema:
                type: string
                format: uri
              description: 카카오 인증 화면. OAuth 액세스/갱신 토큰을 포함하지 않습니다.
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/auth/kakao/callback:
    get:
      operationId: completeKakaoLogin
      tags:
      - auth
      summary: 카카오 인증 결과 처리
      description: code 또는 error 중 하나. state 일치·일회성·만료 검증. 취소/실패 시 사용자·로그인 세션 생성 금지. 성공은 같은 kakao subject에 같은 모의
        사용자 연결 후 세션 ID 회전. 콜백 query는 접근 로그에서 제외합니다.
      x-requirements:
      - FR-001
      - FR-002
      responses:
        '302':
          description: 처리 성공.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Location:
              schema:
                type: string
              description: 서버 설정의 FE 주소 + /auth/callback?status=success|cancelled|failed. 실패 시 code는 ErrorCode의
                안전한 코드만 전달하며 OAuth 인증 코드·토큰·제공사 원문은 전달하지 않습니다.
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          $ref: '#/components/responses/Error502'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - name: error_description
        in: query
        required: false
        schema:
          type: string
  /api/auth/session:
    get:
      operationId: getSession
      tags:
      - auth
      summary: 세션과 CSRF 값 확인
      description: 미로그인은 200 authenticated=false,user=null. 보호 업무 API의 미인증은 401. 세션 확인 자체의 서버 실패와 미로그인을 구분합니다.
      x-requirements:
      - FR-057
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                sample:
                  $ref: ./examples/session-anonymous.json
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
      security: []
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: 로그아웃
      description: 세션 무효화·쿠키 만료. 업무 데이터 보존.
      x-requirements:
      - FR-057
      responses:
        '204':
          description: 처리 성공.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - SessionCookie: []
        CsrfToken: []
  /api/users/me:
    get:
      operationId: getCurrentUser
      tags:
      - user
      summary: 내 정보 조회
      description: 내 정보 조회
      x-requirements:
      - FR-003
      - FR-002
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/users/me/consents:
    put:
      operationId: updateConsents
      tags:
      - user
      summary: 독립 선택 동의 저장
      description: 성공 시 completed=true. 두 거절도 유효. 철회 이후 새 실행/방문/행동 수집 중단, 기존 실행 종료 정리만 허용. 금융 거래·FDS는 독립.
      x-requirements:
      - FR-053
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consents'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - SessionCookie: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdate'
  /api/users/me/settings:
    put:
      operationId: updateSettings
      tags:
      - user
      summary: 접근성·기본 음성 저장
      description: 대상별 명시적 음성 선택·가족 파일을 변경하지 않습니다.
      x-requirements:
      - FR-004
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - SessionCookie: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
  /api/banks:
    get:
      operationId: listBanks
      tags:
      - account
      summary: 선택 가능한 은행 목록
      description: 선택 가능한 은행 목록
      x-requirements:
      - FR-006
      - FR-029
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bank'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/accounts:
    get:
      operationId: listOwnedAccounts
      tags:
      - account
      summary: 불러온 내 계좌 조회
      description: 본인 OWNED·imported 계좌만 accountId 오름차순. primary가 없으면 FE가 첫 계좌임을 설명하고 선택. 목록 응답에 전체 번호/PIN 비교 자료
        없음.
      x-requirements:
      - FR-007
      - FR-008
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedAccount'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/accounts/import-candidates:
    get:
      operationId: listImportCandidates
      tags:
      - account
      summary: 모의 내 계좌 후보 조회
      description: 현재 사용자에게 준비된 미불러오기 후보. 모의 자료 수는 계좌 상한이 아닙니다.
      x-requirements:
      - FR-058
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportCandidate'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/accounts/import:
    post:
      operationId: importOwnedAccounts
      tags:
      - account
      summary: 선택한 모의 내 계좌 불러오기
      description: 선택한 계좌 전체를 한 트랜잭션으로 추가. 첫 추가이며 기본 계좌가 없을 때 선택 순서 첫 계좌를 기본으로 지정. 재요청·추가 불러오기는 기존 기본·잔액·거래 유지.
      x-requirements:
      - FR-058
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedAccount'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - SessionCookie: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountImport'
  /api/accounts/default:
    put:
      operationId: setDefaultAccount
      tags:
      - account
      summary: 기본 내 계좌 저장
      description: 이번 송금의 출금 계좌 변경과 별도 작업. 본인 imported 계좌만 허용.
      x-requirements:
      - FR-008
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedAccount'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - SessionCookie: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - accountId
              properties:
                accountId:
                  $ref: '#/components/schemas/Id'
  /api/accounts/{accountId}/balance:
    get:
      operationId: getBalance
      tags:
      - account
      summary: 선택 내 계좌 잔액 조회
      description: 선택 내 계좌 잔액 조회
      x-requirements:
      - FR-032
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /api/accounts/{accountId}/transactions:
    get:
      operationId: listTransactions
      tags:
      - account
      summary: 선택 내 계좌 거래 조회
      description: 전체 저장 기간, occurredAt 내림차순→transactionId 내림차순. category/direction 생략=ALL. PENSION은 DEPOSIT만; WITHDRAWAL과
        조합은 400. 정상 빈 결과는 []. 조회는 거래 생성·패턴 완료를 하지 않습니다.
      x-requirements:
      - FR-032
      - FR-033
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - TRANSFER
          - PENSION
          - MANAGEMENT_FEE
          - UTILITY_BILL
          - OTHER
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - DEPOSIT
          - WITHDRAWAL
  /api/registered-persons:
    get:
      operationId: listRegisteredPersons
      tags:
      - account
      summary: 사람과 복수 받는 계좌 조회
      description: 사람과 복수 받는 계좌 조회
      x-requirements:
      - FR-005
      - FR-007
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredPerson'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: createRegisteredPerson
      tags:
      - account
      summary: 사람과 최초 받는 계좌 등록
      description: 사람·첫 계좌를 원자적으로 생성. 같은 사용자+requestId 재시도는 같은 사람 반환. 다른 입력의 같은 키는 409.
      x-requirements:
      - FR-006
      responses:
        '201':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - SessionCookie: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreate'
  /api/registered-persons/{registeredPersonId}:
    get:
      operationId: getRegisteredPerson
      tags:
      - account
      summary: 사람 상세 조회
      description: 사람 상세 조회
      x-requirements:
      - FR-005
      responses:
        '200':
          description: 처리 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
