      description: Analysis에서 검증한 제안을 GuidanceService가 동일 대상에 저장. 기간·현재 text/revision·제안 재계산 일치 필수. 오래된 비교/동일문구/비활성은409.
        기존 가족 녹음 유지·불일치 플래그 설정. 반환 targetId로 같은 단계 재녹음 연결.
