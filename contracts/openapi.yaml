        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionApply'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 카카오 성공 후 서버 세션. OAuth 토큰은 FE에 반환하지 않습니다.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: GET /api/auth/session에서 받은 세션 CSRF 값. 로그인/로그아웃 시 재발급.
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: DB BIGINT 식별자의 십진 문자열. 숫자로 변환하지 않습니다.
      example: '101'
    RequestId:
      type: string
      format: uuid
      description: 사용자가 시작한 한 저장 작업의 UUID. 응답 유실 재시도는 같은 값을 사용합니다.
    Instant:
      type: string
      format: date-time
      description: UTC RFC 3339 시각. 저장은 UTC, 날짜 집계는 Asia/Seoul.
    Money:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 정수 원. JSON 정밀도를 보존하는 전송 범위이며 업무별 송금 한도를 의미하지 않습니다.
    ScriptText:
      type: string
      minLength: 1
      maxLength: 500
      pattern: \S
      description: 공백만 입력 불가. 화면·AI·가족 녹음 대본의 공통 문구.
    Revision:
      type: integer
      minimum: 1
      description: 저장 버전. expectedRevision과 불일치하면 409 STALE_REVISION.
    VoiceMode:
      type: string
      enum:
      - TTS
      - FAMILY
    SpeechSpeed:
      type: string
      enum:
      - SLOW
      - NORMAL
      - FAST
    PatternType:
      type: string
      enum:
      - TRANSFER
      - PENSION_CHECK
      - MANAGEMENT_FEE_CHECK
      - BALANCE_CHECK
      - TRANSACTION_HISTORY
      - CUSTOMER_CENTER
      - UTILITY_BILL_CHECK
    StepCode:
      type: string
      enum:
      - SOURCE_ACCOUNT
      - RECIPIENT_PERSON
      - RECIPIENT_ACCOUNT
      - AMOUNT
      - CONFIRM
      - PIN
      - RESULT
      - SUPPORT_CALL
    BankCode:
      type: string
      minLength: 1
      maxLength: 10
      description: GET /api/banks에서 제공한 코드만 허용합니다.
    AccountNumberInput:
      type: string
      minLength: 8
      maxLength: 39
      pattern: ^(?=(?:[^0-9]*[0-9]){8,20}[^0-9]*$)[0-9]+(?:-[0-9]+)*$
      description: 숫자 8–20자리, 숫자 묶음 사이 단일 하이픈만 허용. 저장 전 하이픈 제거.
    MaskedAccountNumber:
      type: string
      minLength: 1
      description: 목록·송금·판정·거래에는 서버가 가린 번호만 제공합니다.
      example: 123-****-789
    PhoneNumber:
      type: string
      pattern: ^[0-9]+(?:-[0-9]+)*$
      minLength: 5
      maxLength: 30
      description: 숫자 또는 숫자 묶음 사이 하이픈. 카카오 수신자 식별자가 아닙니다.
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - fieldErrors
      - retryable
      - requestId
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          description: 사용자에게 보여 줄 쉬운 한국어. 내부 예외·입력값을 포함하지 않습니다.
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        retryable:
          type: boolean
        requestId:
          type: string
          format: uuid
      example:
        code: PIN_MISMATCH
        message: 비밀번호가 맞지 않아요. 다시 입력해 주세요.
        fieldErrors: []
        retryable: true
        requestId: 00000000-0000-4000-8000-000000000001
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      properties:
        status:
          type: string
          enum:
          - UP
        database:
          type: string
          enum:
          - UP
    Consents:
      type: object
      additionalProperties: false
      required:
      - completed
      - usageRecording
      - guardianSharing
      properties:
        completed:
          type: boolean
        usageRecording:
          type: boolean
        guardianSharing:
          type: boolean
    ConsentUpdate:
      type: object
      additionalProperties: false
      required:
      - usageRecording
      - guardianSharing
      properties:
        usageRecording:
          type: boolean
        guardianSharing:
          type: boolean
      description: 두 값이 false여도 저장 성공 시 completed=true. completed는 클라이언트가 설정하지 않습니다.
    Settings:
      type: object
      additionalProperties: false
      required:
      - fontSize
      - speechSpeed
      - defaultVoiceMode
      properties:
        fontSize:
          type: string
          enum:
          - SMALL
          - NORMAL
          - LARGE
        speechSpeed:
          $ref: '#/components/schemas/SpeechSpeed'
        defaultVoiceMode:
          $ref: '#/components/schemas/VoiceMode'
    CurrentUser:
      type: object
      additionalProperties: false
      required:
      - userId
      - name
      - consents
      - settings
      - accountReady
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
        consents:
          $ref: '#/components/schemas/Consents'
        settings:
          $ref: '#/components/schemas/Settings'
        accountReady:
          type: boolean
    AnonymousSession:
      type: object
      additionalProperties: false
      required:
      - authenticated
      - user
      - csrfToken
      properties:
        authenticated:
          type: boolean
          enum:
          - false
        user:
          type: object
          nullable: true
          enum:
          - null
        csrfToken:
          type: string
          minLength: 1
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
      - authenticated
      - user
      - csrfToken
      properties:
        authenticated:
          type: boolean
          enum:
          - true
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
          minLength: 1
    Session:
      oneOf:
      - $ref: '#/components/schemas/AnonymousSession'
      - $ref: '#/components/schemas/AuthenticatedSession'
    Bank:
      type: object
      additionalProperties: false
      required:
      - bankCode
      - bankName
      - logoUrl
      properties:
        bankCode:
          $ref: '#/components/schemas/BankCode'
        bankName:
          type: string
          minLength: 1
        logoUrl:
          type: string
          nullable: true
          description: 없으면 은행명으로 대체합니다.
    OwnedAccount:
      type: object
      additionalProperties: false
      required:
      - accountId
      - bankCode
      - bankName
      - accountAlias
      - maskedAccountNumber
      - balance
      - primary
      properties:
        accountId:
          $ref: '#/components/schemas/Id'
        bankCode:
          $ref: '#/components/schemas/BankCode'
        bankName:
          type: string
        accountAlias:
          type: string
          nullable: true
          maxLength: 50
        maskedAccountNumber:
          $ref: '#/components/schemas/MaskedAccountNumber'
        balance:
          $ref: '#/components/schemas/Money'
        primary:
          type: boolean
    ImportCandidate:
      type: object
      additionalProperties: false
      required:
      - accountId
      - bankCode
      - bankName
      - accountAlias
      - maskedAccountNumber
      - available
      - unavailableReason
      properties:
        accountId:
          $ref: '#/components/schemas/Id'
        bankCode:
          $ref: '#/components/schemas/BankCode'
        bankName:
          type: string
        accountAlias:
          type: string
          nullable: true
          maxLength: 50
        maskedAccountNumber:
          $ref: '#/components/schemas/MaskedAccountNumber'
        available:
          type: boolean
        unavailableReason:
          type: string
          nullable: true
    AccountImport:
      type: object
      additionalProperties: false
      required:
      - accountIds
      properties:
        accountIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          uniqueItems: true
      description: 명시적으로 선택한 후보만 추가. 이미 불러온 계좌는 그대로 반환하며 잔액·거래·기본 계좌를 초기화하지 않습니다.
    RecipientAccountInput:
      type: object
      additionalProperties: false
      required:
      - bankCode
      - accountNumber
      properties:
        bankCode:
          $ref: '#/components/schemas/BankCode'
        accountNumber:
          $ref: '#/components/schemas/AccountNumberInput'
        accountAlias:
          type: string
          nullable: true
          maxLength: 50
    RecipientAccount:
      type: object
      additionalProperties: false
      required:
      - recipientAccountId
      - registeredPersonId
      - bankCode
      - bankName
      - accountAlias
      - maskedAccountNumber
      - revision
      properties:
        recipientAccountId:
          $ref: '#/components/schemas/Id'
        registeredPersonId:
          $ref: '#/components/schemas/Id'
        bankCode:
          $ref: '#/components/schemas/BankCode'
        bankName:
          type: string
        accountAlias:
          type: string
          nullable: true
          maxLength: 50
        maskedAccountNumber:
          $ref: '#/components/schemas/MaskedAccountNumber'
        revision:
          $ref: '#/components/schemas/Revision'
    RecipientAccountEdit:
      type: object
      additionalProperties: false
      required:
      - recipientAccountId
      - registeredPersonId
      - bankCode
      - accountNumber
      - accountAlias
      - revision
      properties:
        recipientAccountId:
          $ref: '#/components/schemas/Id'
        registeredPersonId:
          $ref: '#/components/schemas/Id'
        bankCode:
          $ref: '#/components/schemas/BankCode'
        accountNumber:
          type: string
          pattern: ^[0-9]{8,20}$
        accountAlias:
          type: string
          nullable: true
          maxLength: 50
        revision:
          $ref: '#/components/schemas/Revision'
      description: 본인 계좌 수정 화면 전용. 전체 번호를 반환하는 유일한 업무 조회입니다.
    RegisteredPerson:
      type: object
      additionalProperties: false
      required:
      - registeredPersonId
      - name
      - relationship
      - accountCount
      - accounts
      - revision
      properties:
        registeredPersonId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
        relationship:
          type: string
          minLength: 1
          maxLength: 30
          pattern: \S
        accountCount:
          type: integer
          minimum: 1
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/RecipientAccount'
          minItems: 1
        revision:
          $ref: '#/components/schemas/Revision'
    PersonCreate:
      type: object
      additionalProperties: false
      required:
      - requestId
      - name
      - relationship
      - firstAccount
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
        relationship:
          type: string
          minLength: 1
          maxLength: 30
          pattern: \S
        firstAccount:
          $ref: '#/components/schemas/RecipientAccountInput'
    PersonUpdate:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - name
      - relationship
      properties:
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
        relationship:
          type: string
          minLength: 1
          maxLength: 30
          pattern: \S
    RecipientAccountCreate:
      type: object
      additionalProperties: false
      required:
      - requestId
      - account
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        account:
          $ref: '#/components/schemas/RecipientAccountInput'
    RecipientAccountUpdate:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - account
      properties:
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        account:
          $ref: '#/components/schemas/RecipientAccountInput'
    Balance:
      type: object
      additionalProperties: false
      required:
      - accountId
      - balance
      - asOf
      properties:
        accountId:
          $ref: '#/components/schemas/Id'
        balance:
          $ref: '#/components/schemas/Money'
        asOf:
          $ref: '#/components/schemas/Instant'
    Transaction:
      type: object
      additionalProperties: false
      required:
      - transactionId
      - accountId
      - direction
      - category
      - amount
      - counterpartyName
      - maskedCounterpartyAccountNumber
      - occurredAt
      - balanceAfter
      properties:
        transactionId:
          $ref: '#/components/schemas/Id'
        accountId:
          $ref: '#/components/schemas/Id'
        direction:
          type: string
          enum:
          - DEPOSIT
          - WITHDRAWAL
        category:
          type: string
          enum:
          - TRANSFER
          - PENSION
          - MANAGEMENT_FEE
          - UTILITY_BILL
          - OTHER
        amount:
          $ref: '#/components/schemas/Money'
        counterpartyName:
          type: string
        maskedCounterpartyAccountNumber:
          type: string
          minLength: 1
          description: 목록·송금·판정·거래에는 서버가 가린 번호만 제공합니다.
          example: 123-****-789
          nullable: true
        occurredAt:
          $ref: '#/components/schemas/Instant'
        balanceAfter:
          $ref: '#/components/schemas/Money'
    TemplateStep:
      type: object
      additionalProperties: false
      required:
      - templateStepId
      - stepCode
      - stepOrder
      - title
      - defaultText
      properties:
        templateStepId:
          $ref: '#/components/schemas/Id'
        stepCode:
          $ref: '#/components/schemas/StepCode'
        stepOrder:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
        defaultText:
          $ref: '#/components/schemas/ScriptText'
    PatternTemplate:
      type: object
      additionalProperties: false
      required:
      - templateId
      - patternType
      - title
      - defaultDescription
      - steps
      properties:
        templateId:
          $ref: '#/components/schemas/Id'
        patternType:
          $ref: '#/components/schemas/PatternType'
        title:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
        defaultDescription:
          $ref: '#/components/schemas/ScriptText'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TemplateStep'
          minItems: 1
    FamilyAudio:
      type: object
      additionalProperties: false
      required:
      - audioId
      - audioUrl
      - mimeType
      - sizeBytes
      - durationSeconds
      - recordedTextRevision
      properties:
        audioId:
          $ref: '#/components/schemas/RequestId'
        audioUrl:
          type: string
          description: 인증이 필요한 /api/audio/{audioId} 상대 URL.
        mimeType:
          type: string
